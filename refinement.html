<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>局部微调 · 安心家</title>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    /* ===== 房间画布 ===== */
    .room-stage {
      flex: 1;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      background: #1a1a1a;
    }
    .room-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    .room-bg.master-bedroom { background-image: url('assets/renders/master_bedroom.jpg'); }
    .room-bg.living-room    { background-image: url('assets/renders/living_room.jpg'); }
    .room-bg.children-room  { background-image: url('assets/renders/children_room.jpg'); }
    .room-bg.kitchen        { background-image: url('assets/renders/kitchen.jpg'); }

    /* 非主卧遮罩 */
    .room-overlay {
      position: absolute; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.35); backdrop-filter: blur(2px);
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .room-overlay.visible { opacity: 1; pointer-events: auto; }
    .room-overlay-card {
      background: rgba(255,255,255,0.95); border-radius: 16px;
      padding: 28px 36px; text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .room-overlay-card h3 { margin: 0 0 6px; color: var(--color-deep); font-size: 17px; }
    .room-overlay-card p  { margin: 0; color: var(--color-mute); font-size: 13px; }

    /* 房间 tabs */
    .room-tabs {
      position: absolute; top: 16px; left: 16px;
      display: flex; gap: 6px;
      background: rgba(255,255,255,0.92); padding: 4px;
      border-radius: 999px; box-shadow: var(--shadow-card); z-index: 10;
    }
    .room-tab {
      padding: 6px 14px; border-radius: 999px; font-size: 12px;
      color: var(--color-mute); cursor: pointer; font-weight: 500; transition: 0.15s;
    }
    .room-tab.active { background: var(--color-primary); color: white; }

    /* 场景控件（右上） */
    .scene-controls {
      position: absolute; top: 16px; right: 16px;
      display: flex; gap: 8px; z-index: 10;
    }

    /* 自动保存提示 */
    .autosave-badge {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.92); border-radius: 999px;
      padding: 5px 14px; font-size: 12px; color: var(--color-success);
      font-weight: 600; box-shadow: var(--shadow-card); z-index: 10;
      opacity: 0; transition: opacity 0.4s;
      display: flex; align-items: center; gap: 5px;
      pointer-events: none;
    }
    .autosave-badge.show { opacity: 1; }

    /* 可交互家具 */
    .furniture-item {
      position: absolute; cursor: grab; z-index: 3;
      transition: transform 0.25s cubic-bezier(.4,1.5,.6,1);
      user-select: none;
    }
    .furniture-item:active { cursor: grabbing; }
    .furniture-item img {
      display: block; mix-blend-mode: screen;
      filter: drop-shadow(2px 6px 12px rgba(0,0,0,0.35));
      pointer-events: none; transition: filter 0.2s;
    }
    .furniture-item.selected img {
      filter: drop-shadow(0 0 8px rgba(232,130,91,0.9)) drop-shadow(2px 6px 12px rgba(0,0,0,0.3));
    }
    .furniture-item.selected { transform: scale(1.06); }
    .furniture-item .name-tag {
      position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%);
      background: var(--color-deep); color: white;
      padding: 3px 10px; border-radius: 999px; font-size: 11px;
      white-space: nowrap; opacity: 0; transition: 0.2s; pointer-events: none;
    }
    .furniture-item:hover .name-tag,
    .furniture-item.selected .name-tag { opacity: 1; }
    .furniture-item.has-tip::after {
      content: '?'; position: absolute; top: -6px; right: -6px;
      width: 22px; height: 22px; background: var(--color-warn); color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; border: 2px solid white;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); }
    }
    .tip-badge {
      position: absolute; background: var(--color-warn); color: white;
      padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 600;
      cursor: pointer; box-shadow: var(--shadow-pop);
      display: flex; align-items: center; gap: 5px; z-index: 4;
      animation: badgeIn 0.4s ease;
    }
    @keyframes badgeIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @keyframes itemMove {
      0%   { transform: scale(1.06) rotate(-2deg); }
      50%  { transform: scale(1.1)  rotate(1deg);  }
      100% { transform: scale(1.06) rotate(0deg);  }
    }
    .furniture-item.moving { animation: itemMove 0.5s ease; }

    /* 覆盖tokens.css的workspace布局：画布更宽，右侧更窄 */
    .workspace {
      grid-template-columns: 1fr 320px !important;
      overflow: hidden;
      height: 100%;
    }
    /* app-shell和workspace撑满视口高度，不出现页面滚动条 */
    .app-shell {
      height: 100vh;
      overflow: hidden;
    }
    /* canvas-pane减少padding让画布更高 */
    .canvas-pane {
      padding: 12px 16px !important;
    }

    /* ===== 右侧面板 ===== */
    .chat-pane {
      display: flex; flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    /* 折叠卡片区域：固定最大高度+内部滚动，不撑开画布 */
    .accordions-wrap {
      overflow-y: auto;
      flex-shrink: 0;
      max-height: 62vh;
    }

    /* 折叠卡片 */
    .accordion {
      border-bottom: 1px solid var(--color-line);
    }
    .accordion-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; cursor: pointer; user-select: none;
      font-size: 12px; font-weight: 600; color: var(--color-deep);
      transition: background 0.15s;
    }
    .accordion-header:hover { background: var(--color-surface-2); }
    .accordion-header .acc-icon { font-size: 15px; transition: transform 0.25s; }
    .accordion.open .acc-icon { transform: rotate(180deg); }
    .accordion-body {
      overflow: hidden; max-height: 0;
      transition: max-height 0.3s ease, padding 0.2s;
      padding: 0 16px;
    }
    .accordion.open .accordion-body {
      max-height: 600px; padding: 0 12px 8px;
    }

    /* 家具属性 */
    .prop-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 0; font-size: 12px; border-bottom: 1px solid var(--color-line);
    }
    .prop-row:last-of-type { border-bottom: none; }
    .prop-row .lbl { color: var(--color-mute); }
    .prop-row .val { color: var(--color-deep); font-weight: 500; }
    .color-swatches { display: flex; gap: 8px; }
    .swatch-btn {
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: 0.15s;
    }
    .swatch-btn.active { border-color: var(--color-deep); transform: scale(1.12); }

    /* 风险历史列表 */
    .risk-list { display: flex; flex-direction: column; gap: 8px; }
    .risk-item {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 7px 10px; border-radius: 8px;
      background: #FFF8F0; border-left: 3px solid var(--color-warn);
      font-size: 12px; transition: 0.3s;
    }
    .risk-item.resolved {
      background: var(--color-surface-2);
      border-left-color: var(--color-line);
      opacity: 0.6;
    }
    .risk-item.resolved .risk-title { text-decoration: line-through; color: var(--color-mute); }
    .risk-item .risk-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .risk-item .risk-title { font-weight: 600; color: var(--color-deep); margin-bottom: 2px; }
    .risk-item .risk-desc  { color: var(--color-mute); line-height: 1.4; }
    .risk-empty { color: var(--color-mute); font-size: 12px; text-align: center; padding: 12px 0; }

    /* Checklist */
    .checklist-inline { display: flex; flex-direction: column; gap: 8px; }
    .checklist-inline-item {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 7px 10px; border-radius: 8px;
      background: var(--color-surface-2); cursor: pointer;
      transition: 0.2s; font-size: 12px;
    }
    .checklist-inline-item:hover { background: #F0EAE4; }
    .checklist-inline-item.checked { opacity: 0.55; }
    .checklist-inline-item.checked .ci-title { text-decoration: line-through; }
    .ci-box {
      width: 18px; height: 18px; border-radius: 4px;
      border: 2px solid var(--color-mute); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; transition: 0.15s; margin-top: 1px;
    }
    .checklist-inline-item.checked .ci-box {
      background: var(--color-success); border-color: var(--color-success); color: white;
    }
    .ci-title { font-weight: 600; color: var(--color-deep); margin-bottom: 2px; }
    .ci-desc  { color: var(--color-mute); line-height: 1.4; }


    /* ===== AI 对话区折叠 ===== */
    .chat-accordion {
      border-top: 1px solid var(--color-line);
      display: flex; flex-direction: column;
      flex: 1; min-height: 0;
      overflow: hidden;
    }
    .chat-accordion-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; cursor: pointer; user-select: none;
      font-size: 12px; font-weight: 600; color: var(--color-deep);
      transition: background 0.15s; flex-shrink: 0;
    }
    .chat-accordion-header:hover { background: var(--color-surface-2); }
    .chat-accordion-header .acc-icon { font-size: 15px; transition: transform 0.25s; }
    .chat-accordion.open .chat-accordion-header .acc-icon { transform: rotate(180deg); }
    .chat-accordion-body {
      display: flex; flex-direction: column;
      flex: 1; min-height: 0;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s ease;
    }
    .chat-accordion.open .chat-accordion-body {
      max-height: 400px;
    }

    /* AI 对话流 */
    .chat-stream-wrap {
      flex: 1; overflow-y: auto; padding: 8px 16px;
      min-height: 0;
      max-height: 1450px;

    }
    .chat-input-wrap {
      /* 把顶部 padding 从 10px 改成 16px，输入框自然向下挪，更美观 */
      padding: 10px 16px 14px; border-top: 1px solid var(--color-line);
      flex-shrink: 0;
    }
    .chat-input-wrap .chat-input {
      display: flex; gap: 8px;
    }
    .chat-input-wrap input {
      flex: 1; border: 1px solid var(--color-line); border-radius: 999px;
      padding: 8px 14px; font-size: 13px; outline: none;
      background: var(--color-surface-2);
    }
    .chat-input-wrap input:focus { border-color: var(--color-primary); }

  </style>
</head>
<body>
  <div class="app-shell">
    <div id="topbar"></div>
    <div id="progress"></div>

    <div class="workspace">
      <!-- ===== 左侧画布 ===== -->
      <div class="canvas-pane">
        <div class="canvas-toolbar">
          <div class="toolbar-group">
            <button class="active">3D 视角</button>
            <button>2D 俯视</button>
            <button>📐 标尺</button>
          </div>
          <div class="toolbar-group">
            <button>↶ 撤销</button>
            <button>↷ 重做</button>
          </div>
          <a href="delivery.html" class="btn btn-soft btn-sm" style="margin-left:auto;">前往成品交付 →</a>
        </div>

        <div class="room-stage" id="room-stage">
          <div class="room-bg master-bedroom" id="room-bg"></div>

          <!-- 非主卧遮罩 -->
          <div class="room-overlay" id="room-overlay">
            <div class="room-overlay-card">
              <h3 id="overlay-title">客厅</h3>
              <p>Demo 中暂未开发，敬请期待</p>
            </div>
          </div>

          <!-- 房间 Tab -->
          <div class="room-tabs">
            <div class="room-tab" data-room="客厅" data-bg="living-room">客厅</div>
            <div class="room-tab active" data-room="主卧" data-bg="master-bedroom">主卧</div>
            <div class="room-tab" data-room="儿童房" data-bg="children-room">儿童房</div>
            <div class="room-tab" data-room="厨房" data-bg="kitchen">厨房</div>
          </div>

          <!-- 自动保存提示 -->
          <div class="autosave-badge" id="autosave-badge">✅ 已保存</div>

          <!-- 场景控件 -->
          <div class="scene-controls">
            <button class="btn btn-ghost btn-sm" style="background:rgba(255,255,255,0.92);" id="back-to-overview">⬅ 返回全屋</button>
          </div>

          <!-- 可交互摆件 -->
          <div class="furniture-layer" id="furniture-layer">
            <div class="furniture-item has-tip" id="f-lamp" style="top:52%;left:24%;width:65px;">
              <img src="assets/furniture/table_lamp.png" width="65" alt="台灯">
              <div class="name-tag">台灯</div>
            </div>
            <div class="furniture-item" id="f-painting" style="top:18%;left:38%;width:110px;">
              <img src="assets/furniture/wall_painting.png" width="110" alt="装饰画">
              <div class="name-tag">装饰画</div>
            </div>
          </div>
        </div>

        <div class="legend" style="display:flex;align-items:center;padding:8px 12px;font-size:12px;">
          <span>💡 点击摆件查看属性 · 拖拽可移动位置</span>
        </div>
      </div>

      <!-- ===== 右侧面板 ===== -->
      <aside class="chat-pane">

        <!-- 折叠卡片区（内部滚动） -->
        <div class="accordions-wrap">

          <!-- 折叠卡片1：家具详情（默认收起，无选中状态） -->
          <div class="accordion" id="acc-furniture">
            <div class="accordion-header" onclick="toggleAcc('acc-furniture')">
              <span id="acc-furniture-title">🪑 家具详情</span>
              <span class="acc-icon">▾</span>
            </div>
            <div class="accordion-body">
              <div id="property-inner">
                <!-- 由JS渲染 -->
              </div>
            </div>
          </div>

          <!-- 折叠卡片2：风险历史（默认折叠，触发时展开） -->
          <div class="accordion" id="acc-risk">
            <div class="accordion-header" onclick="toggleAcc('acc-risk')">
              <span>⚠️ 风险记录 <span id="risk-count" style="font-weight:400;color:var(--color-mute);font-size:11px;">（暂无）</span></span>
              <span class="acc-icon">▾</span>
            </div>
            <div class="accordion-body">
              <div class="risk-list" id="risk-list">
                <div class="risk-empty" id="risk-empty">还没有触发风险，继续调整吧</div>
              </div>
            </div>
          </div>

          <!-- 折叠卡片3：风险提示清单（默认折叠） -->
          <div class="accordion" id="acc-checklist">
            <div class="accordion-header" onclick="toggleAcc('acc-checklist')">
              <span>📋 风险提示清单</span>
              <span class="acc-icon">▾</span>
            </div>
            <div class="accordion-body">
              <div class="checklist-inline" id="checklist-inline">
                <div class="checklist-inline-item" onclick="toggleCheck(this)">
                  <div class="ci-box"></div>
                  <div><div class="ci-title">空调位置是否对着床尾吹?</div><div class="ci-desc">冷风直吹床尾会影响睡眠，建议偏移 30cm 以上。</div></div>
                </div>
                <div class="checklist-inline-item" onclick="toggleCheck(this)">
                  <div class="ci-box"></div>
                  <div><div class="ci-title">床头插座是否够用?</div><div class="ci-desc">至少 2 个 USB + 2 个五孔，装完改不了。</div></div>
                </div>
                <div class="checklist-inline-item" onclick="toggleCheck(this)">
                  <div class="ci-box"></div>
                  <div><div class="ci-title">衣柜与墙之间是否留够清洁空间?</div><div class="ci-desc">建议紧贴或留 30cm 以上。</div></div>
                </div>
                <div class="checklist-inline-item" onclick="toggleCheck(this)">
                  <div class="ci-box"></div>
                  <div><div class="ci-title">主灯是否避开了床正上方?</div><div class="ci-desc">风水忌讳之外，长期视角不舒适。</div></div>
                </div>
              </div>
            </div>
          </div>

        </div><!-- /accordions-wrap -->


        <!-- AI 对话区：可折叠，默认收起 -->
        <div class="chat-accordion" id="chat-accordion">
          <div class="chat-accordion-header" id="chat-accordion-header" onclick="toggleChatAcc()">
            <span>🤖 AI 对话助手</span>
            <span class="acc-icon">▾</span>
          </div>
          <div class="chat-accordion-body" id="chat-accordion-body">

            <div class="chat-stream-wrap">
              <div class="chat-stream" id="chat"></div>
            </div>
            <div class="chat-input-wrap">
              <div class="chat-input">
                <input id="chat-input" placeholder="比如「台灯挪到床头」「装饰画换位置」..." />
                <button class="chat-send" id="chat-send">▶</button>
              </div>
            </div>
          </div>
        </div>

      </aside>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/chat-script.js"></script>
  <script>
    document.getElementById('topbar').innerHTML = AnxinHome.renderTopbar('workspace');
    document.getElementById('progress').innerHTML = AnxinHome.renderProgress('refinement');

    const chat = document.getElementById('chat');

    // ===== 折叠卡片 =====
    function toggleAcc(id) {
      document.getElementById(id).classList.toggle('open');
    }


    // ===== AI 对话区折叠 =====
    let chatScriptStarted = false;
    function toggleChatAcc() {
      const acc = document.getElementById('chat-accordion');
      acc.classList.toggle('open');
      // 第一次展开时启动对话脚本
      if (acc.classList.contains('open') && !chatScriptStarted) {
        chatScriptStarted = true;
        setTimeout(playNext, 400);
      }

    }

    // ===== Checklist 勾选 =====
    function toggleCheck(el) {
      el.classList.toggle('checked');
      const box = el.querySelector('.ci-box');
      box.textContent = el.classList.contains('checked') ? '✓' : '';
    }

    // ===== 自动保存提示 =====
    function showAutosave() {
      const badge = document.getElementById('autosave-badge');
      badge.classList.add('show');
      setTimeout(() => badge.classList.remove('show'), 2000);
    }
    setTimeout(showAutosave, 3000);
    setInterval(showAutosave, 25000);

    // ===== 风险记录系统 =====
    const risks = [];
    function addRisk(id, icon, title, desc) {
      if (risks.find(r => r.id === id)) return;
      risks.push({ id, icon, title, desc, resolved: false });
      renderRisks();
      document.getElementById('acc-risk').classList.add('open');
    }
    function resolveRisk(id) {
      const r = risks.find(r => r.id === id);
      if (r) { r.resolved = true; renderRisks(); }
    }
    function renderRisks() {
      const list = document.getElementById('risk-list');
      const empty = document.getElementById('risk-empty');
      const count = document.getElementById('risk-count');
      const activeCount = risks.filter(r => !r.resolved).length;
      count.textContent = risks.length === 0 ? '（暂无）' : `（${activeCount} 条待处理）`;
      empty.style.display = risks.length === 0 ? 'block' : 'none';
      list.querySelectorAll('.risk-item').forEach(el => el.remove());
      risks.forEach(r => {
        const el = document.createElement('div');
        el.className = 'risk-item' + (r.resolved ? ' resolved' : '');
        el.innerHTML = `
          <div class="risk-icon">${r.icon}</div>
          <div>
            <div class="risk-title">${r.title}</div>
            <div class="risk-desc">${r.desc}</div>
          </div>`;
        list.appendChild(el);
      });
    }

    // ===== 房间切换 =====
    const roomBg = document.getElementById('room-bg');
    const roomOverlay = document.getElementById('room-overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const furnitureLayer = document.getElementById('furniture-layer');

    document.querySelectorAll('.room-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.room-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const bg = tab.dataset.bg;
        const room = tab.dataset.room;
        roomBg.className = 'room-bg ' + bg;
        if (room === '主卧') {
          roomOverlay.classList.remove('visible');
          furnitureLayer.style.display = 'block';
        } else {
          overlayTitle.textContent = room;
          roomOverlay.classList.add('visible');
          furnitureLayer.style.display = 'none';
        }
      };
    });

    // ===== 家具属性数据 =====
    const furnitureProps = {
      'f-lamp': {
        icon: '💡', name: '台灯',
        rows: [['色温','3000K 暖光'],['尺寸','H 55cm'],['参考价','¥ 680']],
        colors: [
          { hex: '#FFE8C8', filter: 'sepia(0.2) saturate(1.2) hue-rotate(10deg)' },
          { hex: '#FCE3D5', filter: 'sepia(0.4) saturate(1.5) hue-rotate(340deg)' },
          { hex: '#E8E8E8', filter: 'grayscale(0.7) brightness(1.1)' },
        ],
      },
      'f-painting': {
        icon: '🖼️', name: '装饰画',
        rows: [['尺寸','60cm × 80cm'],['材质','实木框 / 布面'],['参考价','¥ 380']],
        colors: [
          { hex: '#E8DCC8', filter: 'sepia(0.3)' },
          { hex: '#C9A878', filter: 'sepia(0.6) saturate(1.4)' },
          { hex: '#FFFFFF', filter: 'brightness(1.2) saturate(0.5)' },
        ],
      },
    };

    function renderProperty(id) {
      const data = furnitureProps[id];
      if (!data) return;
      const accTitle = document.getElementById('acc-furniture-title');
      accTitle.textContent = `${data.icon} ${data.name}（已选中）`;
      const inner = document.getElementById('property-inner');
      inner.innerHTML = `
        ${data.rows.map(([l,v]) => `<div class="prop-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('')}
        <div class="prop-row"><span class="lbl">颜色</span>
          <div class="color-swatches">
            ${data.colors.map((c,i) => `<div class="swatch-btn ${i===0?'active':''}" data-filter="${c.filter}" style="background:${c.hex};${c.hex==='#FFFFFF'?'border:1px solid var(--color-line);':''}"></div>`).join('')}
          </div>
        </div>
        <div class="flex gap-2 mt-3">
          <button class="btn btn-ghost btn-sm flex-1">🔄 换款</button>
          <button class="btn btn-soft btn-sm flex-1">📷 上传现货</button>
        </div>
      `;
      inner.querySelectorAll('.swatch-btn').forEach(btn => {
        btn.onclick = () => {
          inner.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const img = document.querySelector(`#${id} img`);
          if (img) img.style.filter = `${btn.dataset.filter} drop-shadow(2px 6px 12px rgba(0,0,0,0.35))`;
          showAutosave();
        };
      });
      // 选中家具时自动展开家具卡片
      document.getElementById('acc-furniture').classList.add('open');
    }

    // ===== 点击选中家具 =====
    document.querySelectorAll('.furniture-item').forEach(item => {
      item.onclick = (e) => {
        if (item._dragging) return;
        document.querySelectorAll('.furniture-item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
        renderProperty(item.id);
        if (item.id === 'f-lamp') triggerLampTip();
        if (item.id === 'f-painting') triggerPaintingTip();
      };
    });

    // ===== 拖拽逻辑 =====
    document.querySelectorAll('.furniture-item').forEach(item => {
      let startX, startY, origLeft, origTop;
      item._dragging = false;
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startX = e.clientX; startY = e.clientY;
        const rect = item.getBoundingClientRect();
        const stageRect = document.getElementById('room-stage').getBoundingClientRect();
        origLeft = rect.left - stageRect.left;
        origTop  = rect.top  - stageRect.top;
        item.style.left = origLeft + 'px';
        item.style.top  = origTop  + 'px';
        item.style.bottom = 'auto'; item.style.right = 'auto';
        item.style.transition = 'none';
        const onMove = (e) => {
          const dx = e.clientX - startX, dy = e.clientY - startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) item._dragging = true;
          item.style.left = (origLeft + dx) + 'px';
          item.style.top  = (origTop  + dy) + 'px';
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          item.style.transition = '';
          if (item._dragging) {
            item.classList.add('moving');
            setTimeout(() => { item.classList.remove('moving'); item._dragging = false; }, 500);
            onFurnitureMoved(item);
            showAutosave();
          }
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });

    function onFurnitureMoved(item) {
      const stageRect = document.getElementById('room-stage').getBoundingClientRect();
      const itemRect  = item.getBoundingClientRect();
      const xPct = (itemRect.left + itemRect.width/2  - stageRect.left) / stageRect.width;

      if (item.id === 'f-lamp') {
        if (xPct > 0.6) {
          // 进入风险区
          if (!lampInRisk) {
            lampInRisk = true;
            triggerLampWindowWarn();
          }
        } else {

          resolveRisk('lamp-window');
          AnxinHome.toast({ type: 'success', title: '✅ 台灯已移动', msg: '位置更新成功，眩光风险已消除。', duration: 3000 });

        }
      }
      if (item.id === 'f-painting') {
        AnxinHome.toast({ type: 'info', title: '🖼️ 装饰画已移动', msg: '新位置视觉重心更均衡。', duration: 2500 });
      }
    }

    // ===== 智能提醒 =====
    let lampInRisk = false;        // 台灯当前是否处于风险区
    let lampTipTriggered  = false;
    let paintingTipTriggered = false;

    function triggerLampMove() {
      const lamp = document.getElementById('f-lamp');
      lamp.style.transition = 'left 0.8s ease, top 0.8s ease';
      lamp.style.left = '68%'; lamp.style.top = '55%'; lamp.style.bottom = 'auto';
      lampInRisk = true;
      setTimeout(() => triggerLampWindowWarn(), 850);
    }

    function triggerLampWindowWarn() {
      AnxinHome.toast({
        type: 'warn', title: '🌟 主动提醒 · 台灯位置',
        msg: '台灯靠近窗边后，白天与自然光叠加会产生眩光，夜间光源偏向一侧。建议放在<b>床头两侧</b>。',
        duration: 2500,
      });
      addRisk('lamp-window', '⚠️', '台灯靠窗 · 眩光风险', '台灯移至窗边，白天自然光叠加会产生眩光，建议移回床头两侧。');
      const badge = document.createElement('div');
      badge.className = 'tip-badge'; badge.id = 'lamp-badge';
      badge.style.top = '12%'; badge.style.right = '28%';
      badge.innerHTML = '⚠️ 眩光风险';
      document.getElementById('room-stage').appendChild(badge);
      setTimeout(() => badge.remove(), 5000);
    }

    function triggerLampTip() {
      if (lampTipTriggered) return;
      lampTipTriggered = true;
      AnxinHome.toast({
        type: 'info', title: '💡 台灯选购建议',
        msg: '主卧台灯建议选 <b>3000K 暖光</b>，色温过高影响入睡。高度约 55-65cm 为宜。',
        duration: 2500,
      });
    }

    function triggerPaintingTip() {
      if (paintingTipTriggered) return;
      paintingTipTriggered = true;
      AnxinHome.toast({
        type: 'info', title: '🖼️ 装饰画摆放建议',
        msg: '挂高建议<b>画面中心距地 145–160cm</b>（视线自然落点）。',
        duration: 2500,
      });
    }

    function triggerWardrobeTip() {
      AnxinHome.toast({
        type: 'warn', title: '🌟 主动提醒 · 采光受影响',
        msg: '衣柜挪到窗边会遮挡 60% 自然光。主卧朝北，建议改回原位或换成<b>低柜</b>。',
        duration: 2500,
      });
      addRisk('wardrobe-light', '⚠️', '衣柜靠窗 · 采光受影响', '衣柜遮挡约60%自然光，主卧朝北本已光弱，建议移回西墙。');
    }

    function triggerStyleTip() {
      AnxinHome.toast({
        type: 'info', title: '💡 选品提示 · 床头柜搭配',
        msg: '床头柜建议选<b>带抽屉款</b>；高度与床垫齐平 ±5cm 最舒适。',
        duration: 2500,
      });
    }

    // ===== 返回全屋 =====
    document.getElementById('back-to-overview').onclick = () => {
      window.location.href = 'global-design.html';
    };

    // ===== 对话脚本（展开对话区时才启动） =====
    const script = window.AnxinChatScripts.bedroom;
    let idx = 0;
    async function playNext() {
      if (idx >= script.length) return;
      const step = script[idx++];
      if (step.role === 'ai') {
        const typing = AnxinHome.appendBubble(chat, { role: 'ai', withTyping: true });
        await AnxinHome.delay(700);
        typing.remove();
        AnxinHome.appendBubble(chat, { role: 'ai', html: step.text });
        playNext();
      } else if (step.role === 'system') {
        AnxinHome.appendBubble(chat, { role: 'system', html: step.text });
        await AnxinHome.delay(200);
        playNext();
      } else if (step.role === 'options') {
        AnxinHome.appendOptions(chat, step.options, (opt) => {
          AnxinHome.appendBubble(chat, { role: 'user', html: opt.label });
          if (opt.label.includes('台灯') || opt.label.includes('灯')) triggerLampMove();
          else if (opt.label.includes('装饰画') || opt.label.includes('画')) triggerPaintingTip();
          else if (opt.label.includes('衣柜')) triggerWardrobeTip();
          else if (opt.label.includes('床头柜')) triggerStyleTip();
        });
      }
    }
    // 注意：playNext 不在页面加载时调用，改由 toggleChatAcc() 首次展开时触发

    // ===== 对话框发送 =====
    document.getElementById('chat-send').onclick = () => {
      const v = document.getElementById('chat-input').value.trim();
      if (!v) return;
      AnxinHome.appendBubble(chat, { role: 'user', html: v });
      document.getElementById('chat-input').value = '';
      setTimeout(() => {
        const typing = AnxinHome.appendBubble(chat, { role: 'ai', withTyping: true });
        setTimeout(() => {
          typing.remove();
          AnxinHome.appendBubble(chat, { role: 'ai', html: '收到，我来调整下 ✅' });
          if (v.includes('台灯') || v.includes('灯')) triggerLampMove();
          else if (v.includes('装饰画') || v.includes('画')) triggerPaintingTip();
          else if (v.includes('衣柜')) triggerWardrobeTip();
          else if (v.includes('梳妆')) {
            AnxinHome.toast({
              type: 'warn', title: '🌟 家务死角提醒',
              msg: '梳妆台与墙留 3cm 缝隙，扫地机器人进不去。建议<b>紧贴墙</b>或<b>留 30cm 以上</b>。',
              duration: 2500,
            });
            addRisk('dresser-gap', '⚠️', '梳妆台留缝 · 清洁死角', '梳妆台与墙之间3cm缝隙扫地机进不去，建议紧贴或留30cm以上。');
          }
        }, 900);
      }, 200);
    };

    document.getElementById('chat-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('chat-send').click();
    });
  </script>
</body>
</html>
