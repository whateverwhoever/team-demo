<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>局部微调 · 安心家</title>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    .room-stage {
      flex: 1;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(180deg, #F5E5D3 0%, #E8C9A8 100%);
      box-shadow: var(--shadow-card);
    }
    .room-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .room-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(180deg, #C9A878 0%, #8A6A4A 100%);
    }
    .room-wall {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 40%;
      background: linear-gradient(180deg, #FBF3EA 0%, #F2DEC8 100%);
    }
    .room-window {
      position: absolute;
      top: 18%;
      right: 12%;
      width: 130px;
      height: 110px;
      background: linear-gradient(180deg, #B8DCEF 0%, #6FA9C9 100%);
      border: 8px solid #4A3C32;
      border-radius: 4px;
      box-shadow: inset 0 0 0 4px #FBF3EA;
    }
    .room-window::before, .room-window::after {
      content: '';
      position: absolute;
      background: #4A3C32;
    }
    .room-window::before { left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); }
    .room-window::after { top: 50%; left: 0; right: 0; height: 3px; transform: translateY(-50%); }

    .furniture-item {
      position: absolute;
      cursor: pointer;
      transition: 0.25s cubic-bezier(.4,1.5,.6,1);
      user-select: none;
    }
    .furniture-item .emoji {
      font-size: 64px;
      filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.2));
    }
    .furniture-item.selected {
      transform: scale(1.1);
    }
    .furniture-item.selected .emoji {
      filter: drop-shadow(0 0 0 var(--color-primary)) drop-shadow(2px 4px 8px rgba(232,130,91,0.5));
    }
    .furniture-item .name-tag {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-deep);
      color: white;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      transition: 0.2s;
    }
    .furniture-item:hover .name-tag,
    .furniture-item.selected .name-tag {
      opacity: 1;
    }
    .furniture-item.has-tip::after {
      content: '?';
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      background: var(--color-warn);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      border: 2px solid white;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .scene-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 5;
    }

    .room-tabs {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 6px;
      background: rgba(255,255,255,0.9);
      padding: 4px;
      border-radius: 999px;
      box-shadow: var(--shadow-card);
      z-index: 5;
    }
    .room-tab {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--color-mute);
      cursor: pointer;
      font-weight: 500;
      transition: 0.15s;
    }
    .room-tab.active { background: var(--color-primary); color: white; }

    .property-panel {
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-line);
    }
    .property-panel h4 {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--color-deep);
    }
    .prop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 12px;
    }
    .prop-row .lbl { color: var(--color-mute); }
    .prop-row .val { color: var(--color-deep); font-weight: 500; }

    .color-swatches {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .swatch-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.15s;
    }
    .swatch-btn.active {
      border-color: var(--color-deep);
      transform: scale(1.1);
    }

    .ground-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .complete-btn-floating {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 5;
    }

    .tip-badge {
      position: absolute;
      background: var(--color-warn);
      color: white;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-pop);
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 4;
      animation: badgeIn 0.4s ease;
    }
    @keyframes badgeIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="topbar"></div>
    <div id="progress"></div>

    <div class="workspace">
      <!-- Canvas -->
      <div class="canvas-pane">
        <div class="canvas-toolbar">
          <div class="toolbar-group">
            <button class="active">3D 视角</button>
            <button>2D 俯视</button>
            <button>📐 标尺</button>
          </div>
          <div class="toolbar-group">
            <button>↶ 撤销</button>
            <button>↷ 重做</button>
          </div>
          <div style="margin-left:auto;" class="tiny muted">📍 当前:<b style="color:var(--color-deep);">主卧 · 子工作流</b></div>
        </div>

        <div class="room-stage">
          <div class="room-tabs">
            <div class="room-tab" data-room="客厅">客厅</div>
            <div class="room-tab active" data-room="主卧">主卧</div>
            <div class="room-tab" data-room="儿童房">儿童房</div>
            <div class="room-tab" data-room="厨房">厨房</div>
          </div>

          <div class="scene-controls">
            <button class="btn btn-ghost btn-sm" style="background:rgba(255,255,255,0.92);" id="back-to-overview">⬅ 返回全屋</button>
            <button class="btn btn-soft btn-sm" id="finish-room">✓ 完成这间</button>
          </div>

          <div class="room-wall"></div>
          <div class="room-floor"></div>
          <div class="ground-grid"></div>
          <div class="room-window"></div>

          <!-- Furniture -->
          <div class="furniture-item" id="f-bed" style="bottom:18%;left:30%;">
            <div class="emoji">🛏️</div>
            <div class="name-tag">双人床 · 1.8m</div>
          </div>

          <div class="furniture-item has-tip" id="f-wardrobe" style="bottom:25%;left:5%;">
            <div class="emoji" style="font-size:72px;">🗄️</div>
            <div class="name-tag">大衣柜 · 4m</div>
          </div>

          <div class="furniture-item" id="f-nightstand" style="bottom:22%;left:54%;">
            <div class="emoji" style="font-size:40px;">🪑</div>
            <div class="name-tag">床头柜</div>
          </div>

          <div class="furniture-item has-tip" id="f-dresser" style="bottom:20%;right:18%;">
            <div class="emoji" style="font-size:54px;">🪞</div>
            <div class="name-tag">梳妆台</div>
          </div>

          <div class="furniture-item" id="f-lamp" style="top:30%;left:48%;">
            <div class="emoji" style="font-size:42px;">💡</div>
            <div class="name-tag">主灯</div>
          </div>

          <button class="btn btn-primary complete-btn-floating" id="next-room">
            前往儿童房 →
          </button>
        </div>

        <div class="legend">
          <span>💡 点击家具查看属性 · 点击「?」展开提醒详情</span>
          <span style="margin-left:auto;color:var(--color-warn);">🟡 已触发 2 条智能提醒</span>
        </div>
      </div>

      <!-- Right pane -->
      <aside class="chat-pane">
        <div class="chat-header">
          <span class="live-dot"></span>
          <span>AI 助手 · 主卧子工作流</span>
        </div>

        <!-- Property panel(默认显示当前选中家具) -->
        <div class="property-panel" id="property">
          <h4>🛏️ 双人床(已选中)</h4>
          <div class="prop-row"><span class="lbl">尺寸</span><span class="val">1.8m × 2.0m</span></div>
          <div class="prop-row"><span class="lbl">材质</span><span class="val">实木 / 软包</span></div>
          <div class="prop-row"><span class="lbl">参考价</span><span class="val">¥ 4,800</span></div>
          <div class="prop-row"><span class="lbl">颜色</span>
            <div class="color-swatches">
              <div class="swatch-btn active" style="background:#E8DCC8;"></div>
              <div class="swatch-btn" style="background:#C9A878;"></div>
              <div class="swatch-btn" style="background:#4A3C32;"></div>
              <div class="swatch-btn" style="background:#FFFFFF;border:1px solid var(--color-line);"></div>
            </div>
          </div>
          <div class="flex gap-2 mt-3">
            <button class="btn btn-ghost btn-sm flex-1">🔄 换款</button>
            <button class="btn btn-soft btn-sm flex-1">📷 上传现货</button>
          </div>
        </div>

        <div class="chat-stream" id="chat" style="max-height:240px;"></div>

        <div class="chat-input">
          <input id="chat-input" placeholder="比如「衣柜挪到南墙」「换深色床头柜」..." />
          <button class="chat-send" id="chat-send">▶</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/chat-script.js"></script>
  <script>
    document.getElementById('topbar').innerHTML = AnxinHome.renderTopbar('workspace');
    document.getElementById('progress').innerHTML = AnxinHome.renderProgress('refinement');

    const chat = document.getElementById('chat');
    const property = document.getElementById('property');

    // Initial chat scripts
    const script = window.AnxinChatScripts.bedroom;
    let idx = 0;
    async function playNext() {
      if (idx >= script.length) return;
      const step = script[idx++];
      if (step.role === 'ai') {
        const typing = AnxinHome.appendBubble(chat, { role: 'ai', withTyping: true });
        await AnxinHome.delay(700);
        typing.remove();
        AnxinHome.appendBubble(chat, { role: 'ai', html: step.text });
        playNext();
      } else if (step.role === 'system') {
        AnxinHome.appendBubble(chat, { role: 'system', html: step.text });
        await AnxinHome.delay(200);
        playNext();
      } else if (step.role === 'options') {
        AnxinHome.appendOptions(chat, step.options, (opt) => {
          AnxinHome.appendBubble(chat, { role: 'user', html: opt.label });
          // 触发对应的智能提醒演示
          if (opt.label.includes('衣柜')) triggerWardrobeMove();
          else if (opt.label.includes('床头柜')) triggerStyleTip();
        });
      }
    }
    setTimeout(playNext, 500);

    // Furniture properties data
    const furnitureProps = {
      'f-bed': {
        icon: '🛏️',
        name: '双人床(1.8m)',
        rows: [
          ['尺寸', '1.8m × 2.0m'],
          ['材质', '实木 / 软包'],
          ['参考价', '¥ 4,800'],
        ],
        colors: ['#E8DCC8', '#C9A878', '#4A3C32', '#FFFFFF'],
      },
      'f-wardrobe': {
        icon: '🗄️',
        name: '大衣柜(4m)',
        rows: [
          ['尺寸', '4.0m × 0.6m × 2.4m'],
          ['容量', '约 14 立方米'],
          ['参考价', '¥ 12,000'],
        ],
        colors: ['#FBF3EA', '#C9A878', '#4A3C32'],
      },
      'f-nightstand': {
        icon: '🪑',
        name: '床头柜',
        rows: [['尺寸', '0.5m × 0.4m'], ['参考价', '¥ 680'], ],
        colors: ['#E8DCC8', '#C9A878', '#4A3C32'],
      },
      'f-dresser': {
        icon: '🪞',
        name: '梳妆台',
        rows: [['尺寸', '1.0m × 0.4m'], ['参考价', '¥ 2,200'], ],
        colors: ['#E8DCC8', '#FFFFFF', '#C9A878'],
      },
      'f-lamp': {
        icon: '💡',
        name: '主灯 · 暖光',
        rows: [['色温', '3000K'], ['功率', '36W'], ['参考价', '¥ 580'], ],
        colors: ['#FFE8C8', '#FCE3D5'],
      },
    };

    function renderProperty(id) {
      const data = furnitureProps[id];
      if (!data) return;
      property.innerHTML = `
        <h4>${data.icon} ${data.name}(已选中)</h4>
        ${data.rows.map(([l, v]) => `<div class="prop-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('')}
        <div class="prop-row"><span class="lbl">颜色</span>
          <div class="color-swatches">
            ${data.colors.map((c, i) => `<div class="swatch-btn ${i === 0 ? 'active' : ''}" style="background:${c};${c === '#FFFFFF' ? 'border:1px solid var(--color-line);' : ''}"></div>`).join('')}
          </div>
        </div>
        <div class="flex gap-2 mt-3">
          <button class="btn btn-ghost btn-sm flex-1">🔄 换款</button>
          <button class="btn btn-soft btn-sm flex-1">📷 上传现货</button>
        </div>
      `;
    }

    document.querySelectorAll('.furniture-item').forEach(item => {
      item.onclick = () => {
        document.querySelectorAll('.furniture-item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
        renderProperty(item.id);

        // Trigger tip for furniture with `?`
        if (item.id === 'f-wardrobe') triggerWardrobeMove();
        if (item.id === 'f-dresser') triggerDresserTip();
      };
    });

    // ============== 智能提醒触发逻辑 ==============
    let wardrobeTriggered = false;
    let dresserTriggered = false;

    function triggerWardrobeMove() {
      if (wardrobeTriggered) return;
      wardrobeTriggered = true;
      // 动画移动衣柜到窗边
      const wardrobe = document.getElementById('f-wardrobe');
      wardrobe.style.left = 'auto';
      wardrobe.style.right = '8%';
      wardrobe.style.bottom = '28%';

      setTimeout(() => {
        AnxinHome.toast({
          type: 'warn',
          title: '🌟 主动提醒 · 采光受影响',
          msg: '衣柜挪到窗边会遮挡 60% 自然光。主卧本身朝北,建议改回原位或换成<b>低柜</b>。',
          duration: 9000,
        });
        // 在画布上加 badge
        const badge = document.createElement('div');
        badge.className = 'tip-badge';
        badge.style.top = '14%';
        badge.style.right = '32%';
        badge.innerHTML = '⚠️ 采光受阻';
        document.querySelector('.room-stage').appendChild(badge);
      }, 600);
    }

    function triggerStyleTip() {
      AnxinHome.toast({
        type: 'info',
        title: '💡 选品提示 · 床头柜搭配',
        msg: '床头柜建议选<b>带抽屉款</b>:夜起拿东西不用开灯;高度与床垫齐平 ± 5cm 最舒适。',
        duration: 8000,
      });
    }

    function triggerDresserTip() {
      if (dresserTriggered) return;
      dresserTriggered = true;
      AnxinHome.toast({
        type: 'warn',
        title: '🌟 家务死角提醒',
        msg: '梳妆台与墙之间留了 3cm 缝隙,扫地机器人进不去,长期会积灰。建议<b>紧贴墙</b>或<b>留 30cm 以上</b>。',
        duration: 8000,
      });
    }

    // 完成本间 → Checklist
    document.getElementById('finish-room').onclick = () => {
      AnxinHome.showChecklist({
        title: '🎉 主卧完成检查清单',
        sub: '装完改不了的事项,确认一遍再进下一间',
        items: [
          { title: '✅ 空调位置是否对着床尾吹?', desc: '冷风直吹床尾会影响睡眠,建议偏移 30cm 以上。' },
          { title: '✅ 床头插座是否够用?', desc: '至少 2 个 USB + 2 个五孔,装完改不了。' },
          { title: '✅ 衣柜与墙之间是否留够清洁空间?', desc: '建议紧贴或留 30cm 以上。' },
          { title: '✅ 主灯是否避开了床正上方?', desc: '风水忌讳之外,长期视角不舒适。' },
        ],
      });
    };

    // 下一间房
    document.getElementById('next-room').onclick = () => {
      AnxinHome.toast({ type: 'info', title: '切换中', msg: '即将进入儿童房子工作流...', duration: 2000 });
      setTimeout(() => {
        document.querySelectorAll('.room-tab').forEach(t => t.classList.remove('active'));
        document.querySelector('[data-room="儿童房"]').classList.add('active');
        AnxinHome.toast({ type: 'success', title: '已切换到儿童房', msg: '右侧对话框已锁定到该空间。' });
      }, 800);
    };

    document.getElementById('back-to-overview').onclick = () => {
      AnxinHome.toast({ type: 'info', title: '返回全屋视角', msg: '可点击其他房间继续微调,或前往成品交付。' });
      setTimeout(() => { window.location.href = 'delivery.html'; }, 1200);
    };

    // Chat send
    document.getElementById('chat-send').onclick = () => {
      const v = document.getElementById('chat-input').value.trim();
      if (!v) return;
      AnxinHome.appendBubble(chat, { role: 'user', html: v });
      document.getElementById('chat-input').value = '';
      setTimeout(() => {
        const typing = AnxinHome.appendBubble(chat, { role: 'ai', withTyping: true });
        setTimeout(() => {
          typing.remove();
          AnxinHome.appendBubble(chat, { role: 'ai', html: '收到,我来调整下 ✅' });
          if (v.includes('衣柜')) triggerWardrobeMove();
          else if (v.includes('梳妆')) triggerDresserTip();
        }, 900);
      }, 200);
    };

    // 房间 tab 切换
    document.querySelectorAll('.room-tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.room-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        AnxinHome.toast({ type: 'info', title: `已切换到 ${t.dataset.room}`, msg: '对话已锁定该空间', duration: 2500 });
      };
    });
  </script>
</body>
</html>
