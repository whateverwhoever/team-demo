<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>建模阶段 · 安心家</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.png">
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    .floorplan-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .room-rect {
      fill: var(--color-surface-2);
      stroke: var(--color-deep);
      stroke-width: 2.5;
      transition: 0.2s;
      cursor: pointer;
    }
    .room-rect:hover { fill: var(--color-primary-soft); }
    .room-rect.living { fill: #FEF1E3; }
    .room-rect.bedroom { fill: #F4EAE0; }
    .room-rect.kitchen { fill: #FFF8E1; }
    .room-rect.bath { fill: #E8F0F4; }
    .room-rect.dining { fill: #FCE8DD; }

    .door-line { stroke: var(--color-primary); stroke-width: 3; fill: none; }
    .window-line { stroke: var(--color-info); stroke-width: 4; }

    .canvas-tip {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(46, 37, 30, 0.85);
      color: white;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
    }
    .confirm-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-surface);
      padding: 12px 16px 12px 20px;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-pop);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 5;
    }
    .room-tag { font-weight: 700; font-size: 13px; fill: var(--color-deep); }
    .room-area { font-size: 11px; fill: var(--color-mute); }

    /* ===== 家庭信息卡片表单 ===== */
    .family-form {
      background: var(--color-surface-2);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-self: flex-start;
      max-width: 92%;
    }
    .family-form .form-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .family-form .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-deep);
    }
    .family-form .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .family-form .chip {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--color-line);
      font-size: 12px;
      cursor: pointer;
      transition: 0.15s;
      background: var(--color-surface);
      color: var(--color-text);
      user-select: none;
    }
    .family-form .chip.selected {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }
    .family-form .chip:hover:not(.selected) {
      border-color: var(--color-primary);
    }
    .family-form .form-extra {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--color-line);
      font-size: 12px;
      font-family: inherit;
      resize: none;
      outline: none;
      background: var(--color-surface);
      color: var(--color-text);
      box-sizing: border-box;
    }
    .family-form .form-extra:focus {
      border-color: var(--color-primary);
    }
    .family-form .form-submit {
      align-self: flex-end;
      background: var(--color-primary);
      color: white;
      border: none;
      padding: 7px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .family-form .form-submit:hover {
      background: var(--color-primary-dark);
    }

    /* 右侧对话流：超出高度后内部滚动，不再撑大整个页面 */
    #chat.chat-stream {
      max-height: 720px;
      overflow-y: auto;
    }

    /* 户型图图片专用样式：保持容器高度不变，图片等比缩小完整显示 */
    .floorplan-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="topbar"></div>
    <div id="progress"></div>

    <div class="workspace">
      <!-- Canvas画布区域 -->
      <div class="canvas-pane">
        <div class="canvas-toolbar">
          <div class="toolbar-group">
            <button class="active">2D 平面图</button>
            <button>3D 预览</button>
          </div>
          <div class="toolbar-group">
            <button>📐 测距</button>
            <button>🏷️ 改标签</button>
            <button class="pro-only" style="display:none;">📏 尺寸标注</button>
            <button class="pro-only" style="display:none;">🔲 网格</button>
          </div>
          <div style="margin-left:auto;" class="tiny muted">
            <span class="novice-label">📍 户型 · 已识别8个空间</span>
            <span class="pro-label" style="display:none;">📍 户型 · 高精度识别 · 8个空间</span>
          </div>
        </div>

        <div class="floorplan-container">
          <div class="canvas-tip">💡 右侧对话框描述房间需求，完成后确认进入3D建模</div>

          <!-- 替换为本地户型图片 -->
          <img class="floorplan-img" src="assets/model/户型图.jpg" alt="平面户型图">

          <div class="confirm-bar">
            <div class="tiny muted">确认户型结构后，一键进入全屋3D建模</div>
            <a href="global-design.html" class="btn btn-primary btn-sm">确认结构 · 下一步 →</a>
          </div>
        </div>

        <!-- 图例保留，适配当前户型空间 -->
        <div class="legend">
          <span><span class="swatch" style="background:#D4A878;border:1px solid #4A3C32;"></span>卧室（主卧/次卧）</span>
          <span><span class="swatch" style="background:#C8CDD1;border:1px solid #4A3C32;"></span>儿童房</span>
          <span><span class="swatch" style="background:#D0D5D9;border:1px solid #4A3C32;"></span>客餐厅/阳台</span>
          <span><span class="swatch" style="background:#E0E3E6;border:1px solid #4A3C32;"></span>厨房</span>
          <span><span class="swatch" style="background:#EFF2F5;border:1px solid #4A3C32;"></span>卫生间</span>
          <span><span class="swatch" style="background:#ffffff;border:1px solid #999;"></span>门</span>
          <span><span class="swatch" style="background:#ffffff;border:1px solid #999;"></span>窗</span>
        </div>
      </div>

      <!-- AI对话侧边栏完整保留 -->
      <aside class="chat-pane">
        <div class="chat-header">
          <span class="live-dot"></span>
          <span>AI 助手 · 建模阶段</span>
          <span class="tag tag-primary" style="margin-left:auto;">小白模式</span>
        </div>
        <div class="chat-stream" id="chat"></div>
      </aside>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/chat-script.js"></script>
  <script>
    document.getElementById('topbar').innerHTML = AnxinHome.renderTopbar('workspace');
    document.getElementById('progress').innerHTML = AnxinHome.renderProgress('modeling');

    // 专业版/小白版切换逻辑
    if (AnxinHome.isPro()) {
      document.querySelectorAll('.pro-only').forEach(el => el.style.display = '');
      document.querySelectorAll('.novice-label').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.pro-label').forEach(el => el.style.display = '');
    }

    const chat = document.getElementById('chat');
    const script = window.AnxinChatScripts.modeling;
    let idx = 0;

    // ===== 家庭信息收集表单 =====
    function appendFamilyForm(onSubmit) {
      const wrap = document.createElement('div');
      wrap.className = 'family-form';

      wrap.innerHTML = `
        <div class="form-row">
          <div class="form-label">👨‍👩‍👧 家里住几口人？</div>
          <div class="chip-group" id="chip-count">
            <div class="chip" data-val="1人独居">1人独居</div>
            <div class="chip" data-val="夫妻2人">夫妻2人</div>
            <div class="chip" data-val="三口之家">三口之家</div>
            <div class="chip" data-val="四口及以上">四口及以上</div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-label">🧒 有没有小孩？</div>
          <div class="chip-group" id="chip-kid">
            <div class="chip" data-val="没有小孩">没有</div>
            <div class="chip" data-val="0-3岁婴幼儿">0-3岁婴幼儿</div>
            <div class="chip" data-val="3-6岁学龄前">3-6岁学龄前</div>
            <div class="chip" data-val="6-12岁小学生">6-12岁小学生</div>
            <div class="chip" data-val="12-18岁青少年">12-18岁青少年</div>
            <div class="chip" data-val="准备生育">准备生育</div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-label">🐾 有没有宠物？</div>
          <div class="chip-group" id="chip-pet">
            <div class="chip" data-val="没有宠物">没有</div>
            <div class="chip" data-val="养猫">🐱 猫</div>
            <div class="chip" data-val="养狗">🐶 狗</div>
            <div class="chip" data-val="其他宠物">其他</div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-label">👴 有无老人同住？</div>
          <div class="chip-group" id="chip-elder">
            <div class="chip" data-val="无老人">没有</div>
            <div class="chip" data-val="老人长期同住">长期同住</div>
            <div class="chip" data-val="老人偶尔来住">偶尔来住</div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-label">✏️ 其他补充（可选）</div>
          <textarea class="form-extra" id="form-extra" rows="2" placeholder="例如：准备生二胎、有轮椅需求、需要书房..."></textarea>
        </div>

        <button class="form-submit" id="form-submit">确认 ✓</button>
      `;

      // 单选芯片交互
      ['chip-count', 'chip-kid', 'chip-pet', 'chip-elder'].forEach(groupId => {
        wrap.querySelector('#' + groupId).querySelectorAll('.chip').forEach(chip => {
          chip.onclick = () => {
            wrap.querySelector('#' + groupId).querySelectorAll('.chip')
              .forEach(c => c.classList.remove('selected'));
            chip.classList.add('selected');
          };
        });
      });

      // 表单提交逻辑
      wrap.querySelector('#form-submit').onclick = () => {
        const getValue = (groupId) => {
          const sel = wrap.querySelector('#' + groupId + ' .chip.selected');
          return sel ? sel.dataset.val : null;
        };
        const count  = getValue('chip-count');
        const kid    = getValue('chip-kid');
        const pet    = getValue('chip-pet');
        const elder  = getValue('chip-elder');
        const extra  = wrap.querySelector('#form-extra').value.trim();

        if (!count) {
          wrap.querySelector('#chip-count').style.outline = '2px solid var(--color-primary)';
          wrap.querySelector('#chip-count').style.borderRadius = '8px';
          return;
        }

        wrap.querySelectorAll('.chip, .form-submit, .form-extra')
          .forEach(el => el.style.pointerEvents = 'none');
        wrap.querySelector('#form-submit').style.opacity = '0.5';

        const parts = [count];
        if (kid && kid !== '没有小孩') parts.push(kid);
        if (pet && pet !== '没有宠物') parts.push(pet);
        if (elder && elder !== '无老人') parts.push(elder);
        if (extra) parts.push(extra);
        const summary = parts.join(' · ');

        onSubmit(summary);
      };

      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return wrap;
    }

    // AI对话脚本播放
    async function playNext() {
      if (idx >= script.length) return;
      const step = script[idx++];

      if (step.role === 'ai') {
        const typing = AnxinHome.appendBubble(chat, { role: 'ai', withTyping: true });
        await AnxinHome.delay(700);
        typing.remove();
        AnxinHome.appendBubble(chat, { role: 'ai', html: step.text });
        await AnxinHome.delay(300);
        playNext();

      } else if (step.role === 'system') {
        AnxinHome.appendBubble(chat, { role: 'system', html: step.text });
        await AnxinHome.delay(200);
        playNext();

      } else if (step.role === 'user') {
        AnxinHome.appendBubble(chat, { role: 'user', html: step.text });
        await AnxinHome.delay(200);
        playNext();

      } else if (step.role === 'familyForm') {
        appendFamilyForm((summary) => {
          AnxinHome.appendBubble(chat, { role: 'user', html: summary });
          setTimeout(playNext, 400);
        });

      } else if (step.role === 'options') {
        AnxinHome.appendOptions(chat, step.options, (opt) => {
          AnxinHome.appendBubble(chat, { role: 'user', html: opt.label });
          if (opt.goto) {
            setTimeout(() => { window.location.href = opt.goto; }, 600);
          } else {
            setTimeout(playNext, 400);
          }
        });
      }
    }

    setTimeout(playNext, 400);

    // 移除原SVG房间点击逻辑（图片无房间DOM元素）
  </script>
</body>
</html>
