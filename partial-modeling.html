<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>建模阶段 · 局部改造 · 安心家</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    .floorplan-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .room-rect {
      fill: #F4EAE0;
      stroke: var(--color-deep);
      stroke-width: 2.5;
      transition: 0.2s;
      cursor: pointer;
    }
    .room-rect:hover { fill: var(--color-primary-soft); }
    .door-line {
      stroke: var(--color-primary);
      stroke-width: 3;
      fill: none;
    }
    .window-line {
      stroke: var(--color-info);
      stroke-width: 4;
    }
    .canvas-tip {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(46, 37, 30, 0.85);
      color: white;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
    }
    .confirm-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-surface);
      padding: 12px 16px 12px 20px;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-pop);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 5;
    }
    .room-tag {
      font-weight: 700;
      font-size: 14px;
      fill: var(--color-deep);
    }
    .room-area {
      font-size: 12px;
      fill: var(--color-mute);
    }
    .furniture-ghost {
      fill: none;
      stroke: var(--color-mute);
      stroke-width: 1.5;
      stroke-dasharray: 5 3;
      opacity: 0.6;
    }
    .furniture-label {
      font-size: 9px;
      fill: var(--color-mute);
      font-style: italic;
    }
    .scan-badge {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-success-bg);
      color: var(--color-success);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="topbar"></div>
    <div id="progress"></div>

    <div class="workspace">
      <!-- Canvas -->
      <div class="canvas-pane">
        <div class="canvas-toolbar">
          <div class="toolbar-group">
            <button class="active">2D 平面图</button>
            <button>3D 预览</button>
          </div>
          <div class="toolbar-group">
            <button>📐 测距</button>
            <button>🏷️ 改标签</button>
          </div>
          <div style="margin-left:auto;" class="tiny muted">📍 主卧扫描数据 · 12.5㎡ · 已清除 4 件家具</div>
        </div>

        <div class="floorplan-container">
          <div class="canvas-tip">💡 这是清除家具后的干净空间骨架</div>
          <div class="scan-badge">📷 扫描完成 · 家具已清除</div>

          <svg class="floorplan-svg" viewBox="0 0 500 420" preserveAspectRatio="xMidYMid meet">
            <!-- 主卧墙体 -->
            <rect x="40" y="40" width="420" height="340" fill="none" stroke="#4A3C32" stroke-width="3" />

            <!-- 房间底色 -->
            <rect class="room-rect" x="40" y="40" width="420" height="340" />

            <!-- 已清除家具(虚线示意) -->
            <rect class="furniture-ghost" x="180" y="120" width="150" height="200" rx="4" />
            <text class="furniture-label" x="255" y="215" text-anchor="middle">双人床(已清除)</text>

            <rect class="furniture-ghost" x="50" y="60" width="50" height="310" rx="3" />
            <text class="furniture-label" x="75" y="210" text-anchor="middle">衣柜(已清除)</text>

            <rect class="furniture-ghost" x="350" y="280" width="90" height="40" rx="3" />
            <text class="furniture-label" x="395" y="305" text-anchor="middle">梳妆台(已清除)</text>

            <rect class="furniture-ghost" x="340" y="120" width="45" height="40" rx="3" />
            <text class="furniture-label" x="363" y="145" text-anchor="middle">床头柜(已清除)</text>

            <rect class="furniture-ghost" x="120" y="120" width="45" height="40" rx="3" />
            <text class="furniture-label" x="143" y="145" text-anchor="middle">床头柜(已清除)</text>

            <!-- 房间标签 -->
            <text class="room-tag" x="250" y="25" text-anchor="middle">主卧 · 12.5㎡</text>

            <!-- 门 -->
            <path class="door-line" d="M 250 375 A 30 30 0 0 1 280 345" />
            <text x="240" y="410" text-anchor="middle" font-size="11" fill="#E8825B" font-weight="600">入户门</text>

            <!-- 窗户 -->
            <line class="window-line" x1="120" y1="40" x2="340" y2="40" />
            <text x="230" y="25" text-anchor="middle" font-size="10" fill="#6FA9C9" font-weight="600">北窗 · 宽 2.2m</text>

            <!-- 尺寸标注 -->
            <text x="250" y="400" text-anchor="middle" font-size="10" fill="var(--color-mute)">4.2m</text>
            <text x="10" y="210" text-anchor="middle" font-size="10" fill="var(--color-mute)" transform="rotate(-90, 10, 210)">3.4m</text>
          </svg>

          <div class="confirm-bar">
            <div class="tiny muted">确认房间信息和标签后进入下一步</div>
            <a href="partial-global-design.html" class="btn btn-primary btn-sm">确认结构 · 下一步 →</a>
          </div>
        </div>

        <div class="legend">
          <span><span class="swatch" style="background:#F4EAE0;border:1px solid #4A3C32;"></span>主卧</span>
          <span><span class="swatch" style="background:var(--color-mute);border:1px dashed var(--color-mute);"></span>已清除家具</span>
          <span><span class="swatch" style="background:#E8825B;"></span>门</span>
          <span><span class="swatch" style="background:#6FA9C9;"></span>窗</span>
        </div>
      </div>

      <!-- Chat -->
      <aside class="chat-pane">
        <div class="chat-header">
          <span class="live-dot"></span>
          <span>AI 助手 · 局部改造建模</span>
          <span class="tag tag-primary" style="margin-left:auto;">小白模式</span>
        </div>
        <div class="chat-stream" id="chat"></div>
        <div class="chat-input">
          <input id="chat-input" placeholder="告诉我你的想法,比如「我想把衣柜改到西墙」..." />
          <button class="chat-send" id="chat-send">▶</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/chat-script.js"></script>
  <script>
    document.getElementById('topbar').innerHTML = AnxinHome.renderTopbar('workspace');
    document.getElementById('progress').innerHTML = AnxinHome.renderProgress('modeling');

    const chat = document.getElementById('chat');
    const script = window.AnxinChatScripts.partialModeling;
    let idx = 0;

    async function playNext() {
      if (idx >= script.length) return;
      const step = script[idx++];

      if (step.role === 'ai') {
        const typing = AnxinHome.appendBubble(chat, { role: 'ai', withTyping: true });
        await AnxinHome.delay(step.withDelay || 700);
        typing.remove();
        AnxinHome.appendBubble(chat, { role: 'ai', html: step.text });
        await AnxinHome.delay(300);
        playNext();
      } else if (step.role === 'system') {
        AnxinHome.appendBubble(chat, { role: 'system', html: step.text });
        await AnxinHome.delay(200);
        playNext();
      } else if (step.role === 'user') {
        AnxinHome.appendBubble(chat, { role: 'user', html: step.text });
        await AnxinHome.delay(200);
        playNext();
      } else if (step.role === 'options') {
        AnxinHome.appendOptions(chat, step.options, (opt) => {
          AnxinHome.appendBubble(chat, { role: 'user', html: opt.label });
          if (opt.goto) {
            setTimeout(() => { window.location.href = opt.goto; }, 600);
          } else {
            setTimeout(playNext, 400);
          }
        });
      }
    }

    setTimeout(playNext, 400);

    // Chat send
    document.getElementById('chat-send').onclick = () => {
      const v = document.getElementById('chat-input').value.trim();
      if (!v) return;
      AnxinHome.appendBubble(chat, { role: 'user', html: v });
      document.getElementById('chat-input').value = '';
      setTimeout(() => {
        const typing = AnxinHome.appendBubble(chat, { role: 'ai', withTyping: true });
        setTimeout(() => {
          typing.remove();
          AnxinHome.appendBubble(chat, { role: 'ai', html: '收到 ✅ 我会把这条记录到改造需求里。' });
        }, 900);
      }, 200);
    };
  </script>
</body>
</html>
