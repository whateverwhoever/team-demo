<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>局部微调 · 局部改造 · 安心家</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    .room-stage {
      flex: 1;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(180deg, #F5E5D3 0%, #E8C9A8 100%);
      box-shadow: var(--shadow-card);
    }
    .room-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .room-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(180deg, #C9A878 0%, #8A6A4A 100%);
    }
    .room-wall {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 40%;
      background: linear-gradient(180deg, #FBF3EA 0%, #F2DEC8 100%);
    }
    .room-window {
      position: absolute;
      top: 18%;
      right: 12%;
      width: 130px;
      height: 110px;
      background: linear-gradient(180deg, #B8DCEF 0%, #6FA9C9 100%);
      border: 8px solid #4A3C32;
      border-radius: 4px;
      box-shadow: inset 0 0 0 4px #FBF3EA;
    }
    .room-window::before, .room-window::after {
      content: '';
      position: absolute;
      background: #4A3C32;
    }
    .room-window::before { left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); }
    .room-window::after { top: 50%; left: 0; right: 0; height: 3px; transform: translateY(-50%); }

    .furniture-item {
      position: absolute;
      cursor: pointer;
      transition: 0.25s cubic-bezier(.4,1.5,.6,1);
      user-select: none;
    }
    .furniture-item .emoji {
      font-size: 64px;
      filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.2));
    }
    .furniture-item.selected {
      transform: scale(1.1);
    }
    .furniture-item.selected .emoji {
      filter: drop-shadow(0 0 0 var(--color-primary)) drop-shadow(2px 4px 8px rgba(232,130,91,0.5));
    }
    .furniture-item .name-tag {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-deep);
      color: white;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      transition: 0.2s;
    }
    .furniture-item:hover .name-tag,
    .furniture-item.selected .name-tag {
      opacity: 1;
    }
    .furniture-item.has-tip::after {
      content: '?';
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      background: var(--color-warn);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      border: 2px solid white;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .scene-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 5;
    }

    .property-panel {
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-line);
    }
    .property-panel h4 {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--color-deep);
    }
    .prop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 12px;
    }
    .prop-row .lbl { color: var(--color-mute); }
    .prop-row .val { color: var(--color-deep); font-weight: 500; }

    .color-swatches {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .swatch-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.15s;
    }
    .swatch-btn.active {
      border-color: var(--color-deep);
      transform: scale(1.1);
    }

    .ground-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .complete-btn-floating {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 5;
    }

    .tip-badge {
      position: absolute;
      background: var(--color-warn);
      color: white;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-pop);
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 4;
      animation: badgeIn 0.4s ease;
    }
    @keyframes badgeIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .scene-label {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-deep);
      z-index: 5;
      box-shadow: var(--shadow-card);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="topbar"></div>
    <div id="progress"></div>

    <div class="workspace">
      <!-- Canvas -->
      <div class="canvas-pane">
        <div class="canvas-toolbar">
          <div class="toolbar-group">
            <button class="active">3D 视角</button>
            <button>2D 俯视</button>
            <button>📐 标尺</button>
            <button class="pro-only" style="display:none;">🔲 网格吸附</button>
          </div>
          <div class="toolbar-group">
            <button>↶ 撤销</button>
            <button>↷ 重做</button>
            <button class="pro-only" style="display:none;">📋 历史版本</button>
          </div>
          <div style="margin-left:auto;" class="tiny muted">
            <span class="novice-label">📍 当前:<b style="color:var(--color-deep);">主卧 · 局部改造</b></span>
            <span class="pro-label" style="display:none;">📍 当前:<b style="color:var(--color-deep);">主卧 · 局部改造</b> · 坐标锁定</span>
          </div>
        </div>

        <div class="room-stage">
          <div class="scene-label">🛏️ 主卧 · 12.5㎡ · 奶油风改造方案</div>

          <div class="scene-controls">
            <button class="btn btn-ghost btn-sm" style="background:rgba(255,255,255,0.92);" id="back-to-overview">⬅ 返回整体设计</button>
            <button class="btn btn-soft btn-sm" id="finish-room">✓ 完成微调</button>
          </div>

          <div class="room-wall"></div>
          <div class="room-floor"></div>
          <div class="ground-grid"></div>
          <div class="room-window"></div>

          <!-- Furniture -->
          <div class="furniture-item" id="f-bed" style="bottom:18%;left:15%;">
            <div class="emoji">🛏️</div>
            <div class="name-tag">双人床 · 1.8m · 靠东墙</div>
          </div>

          <div class="furniture-item has-tip" id="f-wardrobe" style="bottom:25%;left:55%;">
            <div class="emoji" style="font-size:72px;">🗄️</div>
            <div class="name-tag">大衣柜 · 4m · 浅色面板</div>
          </div>

          <div class="furniture-item" id="f-dresser" style="bottom:20%;right:5%;">
            <div class="emoji" style="font-size:54px;">🪞</div>
            <div class="name-tag">梳妆台</div>
          </div>

          <div class="furniture-item" id="f-sofa" style="bottom:32%;left:48%;">
            <div class="emoji" style="font-size:48px;">🛋️</div>
            <div class="name-tag">单人沙发 · 阅读角</div>
          </div>

          <div class="furniture-item has-tip" id="f-lamp" style="top:32%;left:40%;">
            <div class="emoji" style="font-size:42px;">💡</div>
            <div class="name-tag">落地灯 · 3000K</div>
          </div>

          <a href="partial-delivery.html" class="btn btn-primary complete-btn-floating">
            前往成品交付 →
          </a>
        </div>

        <div class="legend">
          <span>💡 点击家具查看属性 · 点击「?」展开提醒详情</span>
          <span style="margin-left:auto;color:var(--color-warn);">🟡 局部改造 · 已触发 2 条智能提醒</span>
        </div>
      </div>

      <!-- Right pane -->
      <aside class="chat-pane">
        <div class="chat-header">
          <span class="live-dot"></span>
          <span>AI 助手 · 主卧微调</span>
        </div>

        <!-- Property panel -->
        <div class="property-panel" id="property">
          <h4>🛏️ 双人床(已选中)</h4>
          <div class="prop-row"><span class="lbl">尺寸</span><span class="val">1.8m × 2.0m</span></div>
          <div class="prop-row"><span class="lbl">材质</span><span class="val">实木 / 软包</span></div>
          <div class="prop-row"><span class="lbl">参考价</span><span class="val">¥ 4,800</span></div>
          <div class="prop-row"><span class="lbl">颜色</span>
            <div class="color-swatches">
              <div class="swatch-btn active" style="background:#E8DCC8;"></div>
              <div class="swatch-btn" style="background:#C9A878;"></div>
              <div class="swatch-btn" style="background:#4A3C32;"></div>
              <div class="swatch-btn" style="background:#FFFFFF;border:1px solid var(--color-line);"></div>
            </div>
          </div>
          <div class="flex gap-2 mt-3">
            <button class="btn btn-ghost btn-sm flex-1">🔄 换款</button>
            <button class="btn btn-soft btn-sm flex-1">📷 上传现货</button>
          </div>
        </div>

        <div class="chat-stream" id="chat" style="max-height:240px;"></div>

        <div class="chat-input">
          <input id="chat-input" placeholder="比如「衣柜换浅色面板」「阅读角挪到窗边」..." />
          <button class="chat-send" id="chat-send">▶</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/chat-script.js"></script>
  <script>
    document.getElementById('topbar').innerHTML = AnxinHome.renderTopbar('workspace');
    document.getElementById('progress').innerHTML = AnxinHome.renderProgress('refinement');

    // Pro mode UI
    if (AnxinHome.isPro()) {
      document.querySelectorAll('.pro-only').forEach(el => el.style.display = '');
      document.querySelectorAll('.novice-label').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.pro-label').forEach(el => el.style.display = '');
    }

    const chat = document.getElementById('chat');
    const property = document.getElementById('property');

    // Initial chat scripts
    const script = window.AnxinChatScripts.partialBedroom;
    let idx = 0;
    async function playNext() {
      if (idx >= script.length) return;
      const step = script[idx++];
      if (step.role === 'ai') {
        const typing = AnxinHome.appendBubble(chat, { role: 'ai', withTyping: true });
        await AnxinHome.delay(700);
        typing.remove();
        AnxinHome.appendBubble(chat, { role: 'ai', html: step.text });
        playNext();
      } else if (step.role === 'system') {
        AnxinHome.appendBubble(chat, { role: 'system', html: step.text });
        await AnxinHome.delay(200);
        playNext();
      } else if (step.role === 'options') {
        AnxinHome.appendOptions(chat, step.options, (opt) => {
          AnxinHome.appendBubble(chat, { role: 'user', html: opt.label });
          if (opt.label.includes('衣柜')) triggerWardrobeTip();
          else if (opt.label.includes('阅读角')) triggerReadingTip();
        });
      }
    }
    setTimeout(playNext, 500);

    // Furniture properties data
    const furnitureProps = {
      'f-bed': {
        icon: '🛏️', name: '双人床(1.8m)',
        rows: [['尺寸', '1.8m × 2.0m'], ['位置', '靠东墙'], ['参考价', '¥ 4,800']],
        colors: ['#E8DCC8', '#C9A878', '#4A3C32', '#FFFFFF'],
      },
      'f-wardrobe': {
        icon: '🗄️', name: '大衣柜(4m · 浅色面板)',
        rows: [['尺寸', '4.0m × 0.6m × 2.4m'], ['容量', '约 14 立方米'], ['参考价', '¥ 12,000']],
        colors: ['#FBF3EA', '#FCE3D5', '#FFFFFF'],
      },
      'f-dresser': {
        icon: '🪞', name: '梳妆台',
        rows: [['尺寸', '1.0m × 0.4m'], ['参考价', '¥ 2,200']],
        colors: ['#E8DCC8', '#FFFFFF', '#C9A878'],
      },
      'f-sofa': {
        icon: '🛋️', name: '单人沙发(阅读角)',
        rows: [['尺寸', '0.9m × 0.85m'], ['面料', '棉麻'], ['参考价', '¥ 2,800']],
        colors: ['#FBF3EA', '#FCE3D5', '#C9A878'],
      },
      'f-lamp': {
        icon: '💡', name: '落地灯 · 暖光',
        rows: [['色温', '3000K'], ['功率', '12W'], ['参考价', '¥ 580']],
        colors: ['#FFE8C8', '#FCE3D5'],
      },
    };

    function renderProperty(id) {
      const data = furnitureProps[id];
      if (!data) return;
      const isPro = AnxinHome.isPro();
      property.innerHTML = `
        <h4>${data.icon} ${data.name}(已选中)</h4>
        ${data.rows.map(([l, v]) => `<div class="prop-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('')}
        ${isPro ? `
        <div class="divider" style="margin:10px 0;"></div>
        <div class="prop-row"><span class="lbl">X 坐标</span><input type="number" value="0.00" step="0.01" style="width:72px;text-align:right;border:1px solid var(--color-line);border-radius:6px;padding:3px 6px;font-size:12px;"> m</div>
        <div class="prop-row"><span class="lbl">Y 坐标</span><input type="number" value="0.00" step="0.01" style="width:72px;text-align:right;border:1px solid var(--color-line);border-radius:6px;padding:3px 6px;font-size:12px;"> m</div>
        <div class="prop-row"><span class="lbl">旋转</span><input type="number" value="0" step="1" style="width:72px;text-align:right;border:1px solid var(--color-line);border-radius:6px;padding:3px 6px;font-size:12px;"> °</div>
        ` : ''}
        <div class="prop-row"><span class="lbl">颜色</span>
          <div class="color-swatches">
            ${data.colors.map((c, i) => `<div class="swatch-btn ${i === 0 ? 'active' : ''}" style="background:${c};${c === '#FFFFFF' ? 'border:1px solid var(--color-line);' : ''}"></div>`).join('')}
          </div>
        </div>
        <div class="flex gap-2 mt-3">
          <button class="btn btn-ghost btn-sm flex-1">🔄 换款</button>
          <button class="btn btn-soft btn-sm flex-1">📷 上传现货</button>
        </div>
        ${isPro ? `
        <div class="flex gap-2 mt-2">
          <button class="btn btn-ghost btn-sm flex-1" style="font-size:11px;">📋 应用到同款</button>
          <button class="btn btn-soft btn-sm flex-1" style="font-size:11px;">💾 保存为预设</button>
        </div>
        ` : ''}
      `;
    }

    document.querySelectorAll('.furniture-item').forEach(item => {
      item.onclick = () => {
        document.querySelectorAll('.furniture-item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
        renderProperty(item.id);
        if (item.id === 'f-wardrobe') triggerWardrobeTip();
        if (item.id === 'f-lamp') triggerLampTip();
      };
    });

    // ============== 智能提醒 ==============
    let wardrobeTriggered = false;
    let lampTriggered = false;

    function triggerWardrobeTip() {
      if (wardrobeTriggered) return;
      wardrobeTriggered = true;
      AnxinHome.toast({
        type: 'warn',
        title: '🌟 选品提示 · 衣柜面板颜色',
        msg: '浅色面板显空间大,但注意主卧朝北日照弱,<b>纯白面板可能显冷</b>。建议选奶油白或米白,配暖光更温馨。',
        duration: 9000,
      });
    }

    function triggerReadingTip() {
      AnxinHome.toast({
        type: 'info',
        title: '💡 布局建议 · 阅读角',
        msg: '阅读角建议靠窗利用自然光,但窗帘要选<b>遮光款</b>。沙发距墙预留 15cm 方便清洁。',
        duration: 8000,
      });
    }

    function triggerLampTip() {
      if (lampTriggered) return;
      lampTriggered = true;
      AnxinHome.toast({
        type: 'warn',
        title: '🌟 灯具提醒 · 主卧朝北',
        msg: '主卧本身采光偏弱,落地灯建议选<b>3000K 暖光 + 可调亮度</b>,避免单一冷光源让房间显暗。',
        duration: 8000,
      });
    }

    // 完成微调 → Checklist
    document.getElementById('finish-room').onclick = () => {
      AnxinHome.showChecklist({
        title: '🎉 主卧改造完成检查清单',
        sub: '装完改不了的事项,确认一遍再交付',
        items: [
          { title: '✅ 床头插座是否够用?', desc: '改造后床换了位置,原插座可能被遮挡,建议提前加装。' },
          { title: '✅ 衣柜与墙之间是否留够清洁空间?', desc: '建议紧贴或留 30cm 以上,避免清洁死角。' },
          { title: '✅ 阅读角落地灯走线是否预留?', desc: '避免电线横穿走道,建议在窗边预留地插。' },
          { title: '✅ 窗帘是否考虑遮光?', desc: '主卧朝北但阅读角靠窗,遮光帘保护家具也提升睡眠质量。' },
        ],
      });
    };

    document.getElementById('back-to-overview').onclick = () => {
      AnxinHome.toast({ type: 'info', title: '返回整体设计', msg: '可继续调整方案,或前往成品交付。' });
      setTimeout(() => { window.location.href = 'partial-global-design.html'; }, 1200);
    };

    // Chat send
    document.getElementById('chat-send').onclick = () => {
      const v = document.getElementById('chat-input').value.trim();
      if (!v) return;
      AnxinHome.appendBubble(chat, { role: 'user', html: v });
      document.getElementById('chat-input').value = '';
      setTimeout(() => {
        const typing = AnxinHome.appendBubble(chat, { role: 'ai', withTyping: true });
        setTimeout(() => {
          typing.remove();
          AnxinHome.appendBubble(chat, { role: 'ai', html: '收到,我来调整下 ✅' });
          if (v.includes('衣柜')) triggerWardrobeTip();
          else if (v.includes('灯') || v.includes('阅读')) triggerLampTip();
        }, 900);
      }, 200);
    };
  </script>
</body>
</html>
